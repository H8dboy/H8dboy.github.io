<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <style>
    :root { --g: #2EE87A; --bg: #070B08; --mag: #ff00c8; --cy: #00e5ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      background: var(--bg);
      color: var(--g);
      text-align: center;
      overflow-x: hidden;
    }

    /* Pioggia Matrix sullo sfondo */
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .38; }

    /* Scanline + vignetta da monitor CRT */
    body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 3; }
    body::before { background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px); }
    body::after { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }

    header, main, footer { position: relative; z-index: 1; }
    header { padding-top: 34px; }
    header img { width: 124px; height: 124px; filter: drop-shadow(0 0 15px var(--g)); animation: glitch-logo 3.5s infinite steps(1); }

    h1 {
      margin: 10px 0 0;
      font-size: 2rem;
      letter-spacing: .12em;
      text-shadow: 0 0 20px var(--g);
      animation: glitch-text 3.5s infinite steps(1);
    }

    .tag { margin: 8px 0 22px; font-size: .78rem; letter-spacing: .08em; opacity: .85; min-height: 1.2em; }
    .tag::before { content: "> "; opacity: .6; }
    .cur { display: inline-block; width: .6em; height: 1em; margin-left: 2px; background: var(--g); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    main { width: 86%; max-width: 340px; margin: 0 auto; filter: drop-shadow(0 0 7px rgba(46,232,122,.55)); }

    /* Pulsanti con angoli tagliati */
    .btn {
      --cut: 13px;
      display: block;
      margin: 0 0 13px;
      padding: 1.5px;
      background: var(--g);
      color: var(--g);
      text-decoration: none;
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    }
    .btn .in {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: var(--bg);
      font-weight: 700;
      font-size: .9rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
      transition: background .15s, color .15s;
    }
    .btn .lbl { flex: 1; text-align: left; }
    .btn .lbl::before { content: "./"; opacity: .5; }
    .btn .idx { font-size: .7rem; opacity: .5; letter-spacing: .05em; }
    .icon { width: 20px; height: 20px; flex: none; }

    .btn:hover .in, .btn:active .in { background: var(--g); color: #000; animation: jolt .25s steps(2); }
    .btn:hover .icon[stroke], .btn:active .icon[stroke] { stroke: #000; }
    @keyframes jolt { 0% { transform: translateX(-3px); } 50% { transform: translateX(3px); } 100% { transform: none; } }

    footer { margin: 14px 0 26px; font-size: .68rem; letter-spacing: .12em; opacity: .65; }
    .dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--g); box-shadow: 0 0 8px var(--g); animation: blink 1.6s steps(1) infinite; }

    /* Effetto glitch */
    @keyframes glitch-logo {
      0%, 86%, 100% { transform: none; filter: drop-shadow(0 0 15px var(--g)); clip-path: none; }
      87% { transform: translate(-6px, 2px) skewX(-8deg); filter: drop-shadow(5px 0 0 var(--mag)) drop-shadow(-5px 0 0 var(--cy)); clip-path: inset(10% 0 55% 0); }
      89% { transform: translate(7px, -3px) skewX(6deg); filter: drop-shadow(-6px 0 0 var(--mag)) drop-shadow(6px 0 0 var(--cy)); clip-path: inset(48% 0 12% 0); }
      91% { transform: translate(-3px, 1px); filter: drop-shadow(3px 0 0 var(--mag)) drop-shadow(-3px 0 0 var(--cy)); clip-path: none; }
      93% { transform: translate(4px, 0) skewX(-4deg); filter: drop-shadow(0 0 15px var(--g)); clip-path: inset(30% 0 35% 0); }
      95% { transform: none; filter: drop-shadow(-4px 0 0 var(--mag)) drop-shadow(4px 0 0 var(--cy)); clip-path: none; }
    }
    @keyframes glitch-text {
      0%, 86%, 100% { transform: none; text-shadow: 0 0 20px var(--g); }
      87% { transform: translateX(-5px) skewX(-10deg); text-shadow: 4px 0 var(--mag), -4px 0 var(--cy); }
      90% { transform: translateX(6px) skewX(8deg); text-shadow: -5px 0 var(--mag), 5px 0 var(--cy); }
      93% { transform: translateX(-2px); text-shadow: 2px 0 var(--mag), -2px 0 var(--cy); }
    }
    @media (prefers-reduced-motion: reduce) {
      header img, h1, .cur, .dot, .btn:hover .in { animation: none; }
    }
  </style>

  <script>
    // Riga che si scrive da sola, stile terminale
    const line = "retrofit // reverse engineering";
    const typed = document.getElementById('typed');
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still) { typed.textContent = line; }
    else {
      let n = 0;
      (function type() {
        typed.textContent = line.slice(0, n++);
        if (n <= line.length) setTimeout(type, 45 + Math.random() * 60);
      })();
    }

    // Pioggia Matrix
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    const glyphs = "01アカサタナハマヤラ<>/#$";
    const size = 14;
    let drops = [];
    function fit() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array.from({ length: Math.ceil(canvas.width / size) }, () => Math.random() * -40);
    }
    fit();
    window.addEventListener('resize', fit);

    function draw() {
      ctx.fillStyle = "rgba(7, 11, 8, 0.07)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#2EE87A";
      ctx.font = size + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(glyphs[Math.floor(Math.random() * glyphs.length)], i * size, drops[i] * size);
        if (drops[i] * size > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    if (!still) setInterval(draw, 40);
  </script>
